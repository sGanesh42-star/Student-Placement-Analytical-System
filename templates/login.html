{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-wrap"><div class="form-card"><h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Login to your placement dashboard.</p>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 text-center">New here? <a href="{{ url_for('signup') }}">Create account</a></p></div></div>{% endblock %}
