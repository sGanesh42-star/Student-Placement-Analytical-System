{% extends "base.html" %}{% block title %}Sign up{% endblock %}{% block content %}
<div class="auth-wrap"><div class="form-card"><h2 class="fw-bold">Create account</h2><p class="text-secondary">Start exploring your placement readiness.</p>
<form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 6 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-primary w-100">Create account</button></form><p class="mt-3 text-center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div></div>{% endblock %}
